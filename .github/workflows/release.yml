name: Release

# Push a tag like v0.2.0. The job waits on the "release" environment: configure it in the repo settings with
# required reviewers so every release needs a second person's approval (spec §18.2).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC for the provenance attestation: no long-lived publishing token
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
        working-directory: pharon-plugin
      - name: Refuse to ship a CLI that trusts dev keys
        run: |
          if grep -E '"(feed|root)-dev"' pharon-plugin/lib/keys.mjs; then
            echo "::error::pharon-plugin/lib/keys.mjs still trusts development keys"; exit 1
          fi
          if git ls-files --error-unmatch pharon-plugin/lib/keys.local.mjs 2>/dev/null; then
            echo "::error::pharon-plugin/lib/keys.local.mjs (developer-only trusted keys) must not be committed"; exit 1
          fi
      - name: Package plugin + checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./pharon-plugin/package.json").version')" = "$VERSION"
          test "$(node -p 'require("./pharon-plugin/.claude-plugin/plugin.json").version')" = "$VERSION"
          mkdir dist
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --exclude='*.test.mjs' -czf "dist/pharon-plugin-$VERSION.tar.gz" pharon-plugin
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Verify before installing:
          sha256sum -c SHA256SUMS
          gh attestation verify pharon-plugin-${GITHUB_REF_NAME#v}.tar.gz --repo $GITHUB_REPOSITORY"
